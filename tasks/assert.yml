---
# The dict of v0.x is gone; a play that still sets it would get the defaults without noticing
- name: Assert the old _mongos dict is not set
  ansible.builtin.assert:
    that:
      - _mongos is not defined
    fail_msg: "_mongos (a dict) was replaced by the flat _mongos_* variables in v1.0.0, see the README"
    quiet: true
  tags:
    - always

- name: Assert the paths, user, group and listen settings
  ansible.builtin.assert:
    that:
      - _mongos_log_path is string
      - _mongos_log_path is match('^/\\S+\\Z')
      - _mongos_user is string
      - _mongos_user is match('^[a-z_][a-z0-9_-]*\\Z')
      - _mongos_group is string
      - _mongos_group is match('^[a-z_][a-z0-9_-]*\\Z')
      - _mongos_bind_ip is string
      - _mongos_bind_ip is match('^[^\\s,]+(,[^\\s,]+)*\\Z')
      - _mongos_port is not boolean
      - _mongos_port | string is match('^[0-9]+\\Z')
      - _mongos_port | int >= 1
      - _mongos_port | int <= 65535
      - _mongos_max_connections is not boolean
      - _mongos_max_connections | string is match('^[0-9]+\\Z')
      - _mongos_max_connections | int >= 1
    fail_msg: >-
      _mongos_log_path must be an absolute path without whitespace, _mongos_user and _mongos_group user and group names,
      _mongos_bind_ip one or more comma-separated addresses, _mongos_port a port (1-65535) and _mongos_max_connections a positive integer
    quiet: true
  tags:
    - always

- name: Assert the config server replica set
  ansible.builtin.assert:
    that:
      - _mongos_sharding is mapping
      - _mongos_sharding.configdb is defined
      - _mongos_sharding.configdb is mapping
      - _mongos_sharding.configdb.replicaset_name is defined
      - _mongos_sharding.configdb.replicaset_name is string
      - _mongos_sharding.configdb.replicaset_name is match('^[A-Za-z0-9_.-]+\\Z')
      - _mongos_sharding.configdb.members is defined
      - _mongos_sharding.configdb.members is sequence
      - _mongos_sharding.configdb.members is not string
      - _mongos_sharding.configdb.members | length > 0
      - _mongos_sharding.configdb.members | reject('string') | list | length == 0
      - _mongos_sharding.configdb.members | reject('match', '^[^\\s,/:]+:[0-9]+\\Z') | list | length == 0
    fail_msg: "_mongos_sharding.configdb needs replicaset_name (a replica set name) and members (a non-empty list of host:port)"
    quiet: true
  tags:
    - always

- name: Assert the TLS settings
  ansible.builtin.assert:
    that:
      - _mongos_tls is mapping
      - _mongos_tls | length == 0 or (_mongos_tls.certificatekeyfile is defined and _mongos_tls.certificatekeyfilepassword is defined)
      - _mongos_tls.certificatekeyfile is not defined or _mongos_tls.certificatekeyfile is match('^[^/\\s]\\S*\\Z')
      - _mongos_tls.certificatekeyfilepassword is not defined or (_mongos_tls.certificatekeyfilepassword | string | length > 0)
      - _mongos_tls.cert_glob_file is not defined or _mongos_tls.cert_glob_file is match('^/\\S+\\Z')
      - _mongos_tls.cafile is not defined or _mongos_tls.cafile is match('^/\\S+\\Z')
      - _mongos_tls.mode is not defined or _mongos_tls.mode in _mongos_tls_modes
    fail_msg: >-
      _mongos_tls must be {} or have certificatekeyfile (a relative path without whitespace) and certificatekeyfilepassword (not empty);
      cert_glob_file and cafile are absolute paths, mode one of {{ _mongos_tls_modes | join(', ') }}
    quiet: true
  tags:
    - always
