---
- name: Assert
  ansible.builtin.import_tasks: assert.yml
  tags:
    - always

- name: Create Mongos log directory
  ansible.builtin.file:
    path: "{{ _mongos_log_path }}"
    state: directory
    owner: "{{ _mongos_user }}"
    group: "{{ _mongos_group }}"
    mode: "0750"

- name: Create Mongos logrotate config file
  ansible.builtin.template:
    src: "etc/logrotate.d/mongos.j2"
    dest: "/etc/logrotate.d/mongos"
    owner: root
    group: root
    mode: "0644"

- name: Create Mongos config file
  ansible.builtin.template:
    src: "etc/mongos.conf.j2"
    dest: "/etc/mongos.conf"
    owner: root
    group: root
    mode: "0644"

- name: Create Mongos systemd script
  ansible.builtin.template:
    src: "etc/systemd/system/mongos.service.j2"
    dest: "/etc/systemd/system/mongos.service"
    owner: root
    group: "{{ _mongos_group }}"
    mode: "0644"
  notify:
    - Reload systemd daemon

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Create Mongos systemd helper script
  ansible.builtin.template:
    src: "usr/local/bin/mongos-pre-start.sh.j2"
    dest: "/usr/local/bin/mongos-pre-start.sh"
    owner: root
    group: "{{ _mongos_group }}"
    mode: "0754"

- name: Configure Mongo TLS
  when: _mongos_tls | length > 0
  block:
    - name: Copy Mongos TLS certificateKeyFile
      ansible.builtin.copy:
        src: "{{ _mongos_tls.certificatekeyfile }}"
        dest: "/{{ _mongos_tls.certificatekeyfile }}"
        owner: root
        group: "{{ _mongos_group }}"
        mode: "0640"

    - name: Add certificate location to glob file
      ansible.builtin.lineinfile:
        dest: "{{ _mongos_tls.cert_glob_file }}"
        owner: root
        group: root
        mode: "0644"
        create: true
        line: "/{{ _mongos_tls.certificatekeyfile }}"
      when: _mongos_tls.cert_glob_file is defined

- name: Disable Service Autostart
  ansible.builtin.systemd:
    name: "mongos"
    enabled: false
